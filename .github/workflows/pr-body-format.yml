name: pr-body-format

on:
  pull_request:
    branches: [main]
    # `edited` re-runs the check once the author fixes the body. Without it
    # the original red result stands.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-body-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-body-format:
    runs-on: ubuntu-latest
    steps:
      - uses: elecnix/gh-pr-body-action@08c74dc0736abe295e90d6363abd55cf7ea63ef3  # v1.2.1
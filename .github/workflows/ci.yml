name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the gate shells out to the vale binary; the vendored styles are
      # checked in but the binary is not, so CI installs it from the
      # errata-ai/vale release that matches the version this suite is
      # calibrated against
      - run: |
          curl -fsSL https://github.com/errata-ai/vale/releases/download/v3.20.0/vale_3.20.0_Linux_64-bit.tar.gz | tar -xz -C /usr/local/bin vale
          vale --version
      - run: npm test
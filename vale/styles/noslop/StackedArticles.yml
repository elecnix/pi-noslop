---
# A reduced relative that stacks two `the` phrases and strands the clause's
# verb behind both: "the validator engine the gate uses". English puts the verb
# between them ("the gate validates the schema"), so stacking pushes it to the
# end, far from its object. Fix by naming the actor and putting its verb next.
#
# Every middle token is enumerated and none may be a finite verb, so ordinary
# subject-verb-object prose can never match. Known miss: the tagger reads a
# plural noun like "oracles" as VBZ, so "the oracles the gate validates
# against" slips through. Adding VBZ to the middle doubles the hit rate and
# fires on "The parser reads the schema's version from the header", which
# is correct English. This ruleset gates a pre-edit hook that BLOCKS, so a
# false positive costs more than a miss. Precision wins.
extends: sequence
message: "Stacked articles: '%[1]s ... the'. Two `the` phrases with the verb stranded behind both. Name the actor and put its verb next to it."
level: error
tokens:
  - pattern: (?i)the
  - tag: JJ|JJR|JJS|NN|NNS|NNP|NNPS|VBN|VBG
    min: 2
  - pattern: (?i)the
    target: true
